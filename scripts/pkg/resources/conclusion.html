<body>
<h3>二狗输入法已安装</h3>
<ol>
<li>打开“系统设置 → 键盘 → 输入法 → 编辑…”，点“+”，在“简体中文”里选<b>二狗</b>。如果列表里还没有，注销再登录一次。</li>
<li>切到二狗输入法，在菜单栏的输入法菜单里选“打开设置…”，到“语音”页下载语音模型（需要你确认才下载）。</li>
<li>第一次用语音时，系统会询问麦克风权限；要在其他输入法下也能按右 Option 说话，还要在“隐私与安全性 → 输入监控”里打开二狗输入法。</li>
</ol>
<p>卸载：运行发布页附带的 <code>uninstall.sh</code>。</p>
</body></html>
