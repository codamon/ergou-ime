# ergou-ime — 二狗五笔：五笔 86（极点码表）+ 拼音混输
# SPDX-License-Identifier: GPL-3.0-only
#
# Our own schema. rime-wubi86-jidian's files are used as data only
# (wubi86_jidian.dict.yaml, pinyin_simp.dict.yaml) and never edited. Pinyin
# comes from ergou_pinyin_dict: 拼音大词库 (rime-ice) once downloaded in
# Settings, pinyin_simp until then (ErgouIME/Engine/PinyinDictionary.swift).
# Shipped read-only in ErgouIME.app/Contents/SharedSupport/rime-data.
#
# User settings do NOT edit this file. The input method writes
# ergou_wubi.custom.yaml / ergou_pinyin.custom.yaml into its private Rime
# user directory from the values chosen in ErgouIME Settings, then redeploys
# (ErgouIME/Engine/RimeUserConfig.swift). Keys under `ergou/` are read by
# the Lua components in lua/ergou/.
#
# STATUS: first draft, never deployed. Every component marked "verify" is in
# docs/PLAN-v1.md M1.5.

schema:
  schema_id: ergou_wubi
  name: 二狗五笔
  version: "0.1"
  author:
    - ergou-ime contributors
  description: |
    五笔 86（极点码表）与拼音混输。拼音候选注明五笔编码。
    ` 开头只打拼音。
  dependencies:
    # Builds the pinyin prism (with fuzzy/typo spellings) and the correction
    # table used by script_translator@pinyin below.
    - ergou_pinyin
    # Builds the English prism for table_translator@english (中英混输).
    - ergou_en

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中, En ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: extended_charset
    states: [ 常用, 扩展 ]
  - name: ascii_punct
    states: [ 。，, ．， ]
  - name: traditionalization
    states: [ 简, 繁 ]
  # Emoji and symbols after the word that names them (simplifier@emoji).
  # Off unless turned on in Settings: an extra candidate moves the ones
  # after it, and 五笔 is typed by position. The input method sets it for
  # every text field (RimeEngine.ensureSession).
  - name: emoji
    reset: 0
    states: [ 无, 😄 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    # Optional "四码唯一自动上屏" (ergou/auto_commit). Must run before speller:
    # it may push the 4th key itself and decide whether to commit.
    - lua_processor@*ergou.auto_commit
    # 以词定字: [ ] take the first / last character of the candidate.
    - lua_processor@*ergou.select_character
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    # "`…" = pinyin only. Not "z" (rime-wubi86-jidian's reverse-lookup key):
    # in mixed input z/zh syllables are typed directly, so a z prefix would
    # turn "zhong" into z + "hong". Runs after abc_segmentor and removes the
    # abc tag from the `-segment, so the wubi table and the mixed pinyin
    # translator do not see it.
    - affix_segmentor@pinyin_only
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    # Wubi is split in two so the engine already emits candidates in the
    # right order (exact wubi → pinyin → unfinished wubi codes). One table
    # with completion on put exact codes behind long pinyin lists: "e" has
    # 100+ pinyin characters and 有 (wubi "e") fell out of rank.lua's window
    # (found on D's Mac, 2026-11-09).
    - table_translator                     # wubi, exact codes only, high quality
    - table_translator@wubi_completion     # wubi, unfinished codes, low quality
    - script_translator@pinyin             # mixed pinyin (tag abc)
    - script_translator@pinyin_only        # after the ` prefix
    - table_translator@english             # 中英混输 (tag abc)
    - lua_translator@*ergou.wubi_correction  # only when the code is empty
    - lua_translator@*ergou.calc             # =12*3.5+8
    - lua_translator@*ergou.date             # rq / sj / xq
    - lua_translator@*ergou.phrases          # 常用语 by code
  filters:
    # Adds wubi codes to pinyin candidates: "我  q · trnt".
    - lua_filter@*ergou.code_hint
    # Order: exact wubi → pinyin → unfinished wubi codes → corrections.
    - lua_filter@*ergou.rank
    # 中英混输: English word first, or second when a Chinese candidate (exact
    # wubi code or pinyin) has the same keys.
    - lua_filter@*ergou.english
    # Emoji and symbols after the word that names them (when on).
    - simplifier@emoji
    # 简 → 繁 when the 繁体 switch is on (OpenCC s2t; input method menu).
    - simplifier
    # Same text from wubi and pinyin: keep the first (higher-ranked) one.
    - uniquifier

# ---- ergou-ime options (written by the input method from Settings) ----
ergou:
  # "四码唯一自动上屏". Default off (D, 2026-11-08): no auto-commit, pick with
  # Space/digits. On: lua/ergou/auto_commit.lua commits a unique 4-key wubi
  # code and does 四码顶字. The candidate order is the same in both modes
  # (lua/ergou/rank.lua, D 2026-11-09).
  auto_commit: false
  # Only with auto_commit. false = wait one key when the 4 keys are also a
  # pinyin prefix; true = strict: commit any unique 4-key code at once
  # (long pinyin then needs the ` prefix).
  auto_commit_strict: false
  # Fuzzy pinyin pairs that are on. Must match the derive rules written to
  # ergou_pinyin.custom.yaml; lua/ergou/pinyin.lua uses it to decide whether
  # some keys are "still valid pinyin". Ids: see lua/ergou/pinyin.lua.
  fuzzy: [ zh_z, ch_c, sh_s, n_l, en_eng, in_ing ]
  # Pinyin typo rules are in ergou_pinyin's algebra (Settings: 拼音容错);
  # lua/ergou/pinyin.lua mirrors them when this is true.
  pinyin_correction: true
  # Wubi correction on empty codes (lua/ergou/wubi_correction.lua).
  wubi_correction: true
  # 以词定字 (lua/ergou/select_character.lua).
  select_character: true

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  # Off in both modes. rime-wubi86-jidian turns these on, but the built-in
  # speller would cut long pinyin at 4 keys ("shan|g"). When the user turns
  # 四码唯一自动上屏 on, lua/ergou/auto_commit.lua does it instead and only
  # counts wubi candidates.
  auto_select: false
  max_code_length: 0

translator:
  dictionary: wubi86_jidian
  enable_charset_filter: true
  # Exact codes only; unfinished codes come from wubi_completion below.
  enable_completion: false
  enable_sentence: false
  # 自动调频 on, 自动造词 off (D, 2026-11-08, option A). Settings writes
  # translator/enable_user_dict and pinyin/enable_user_dict together.
  # Why encoder/history stay off: encode_commit_history turns every run of
  # consecutive commits into 2–5 character user phrases (mostly junk) that
  # make unique 4-key codes non-unique. enable_user_dict alone only updates
  # the committed (code, text) pair, and DistinctTranslation de-duplicates by
  # text, so no code gains a candidate (librime 1.17.0 table_translator.cc,
  # translation.cc).
  enable_user_dict: true
  enable_encoder: false
  encode_commit_history: false
  # Above any pinyin candidate (pinyin quality is at most about 2).
  initial_quality: 10
  comment_format:
    - xform/.+//                        # wubi candidates show no code
  disable_user_dict_for_patterns:
    - "^`.*$"

# Unfinished wubi codes (e.g. "wo" → 伙 is exact, 你 wqiy is unfinished).
# Ranked below every pinyin candidate. Exact codes it also returns are
# dropped by uniquifier (same text, lower rank). No user dictionary here:
# 调频 is recorded by the main table translator.
wubi_completion:
  dictionary: wubi86_jidian
  enable_charset_filter: true
  enable_completion: true
  enable_sentence: false
  enable_user_dict: false
  initial_quality: -10
  comment_format:
    - xform/.+//

# Mixed pinyin: same input segment as wubi (tag abc).
pinyin:
  tag: abc
  dictionary: ergou_pinyin_dict
  prism: ergou_pinyin                   # built by ergou_pinyin.schema.yaml
  # The dictionary was pinyin_simp before 2026-11-10; keep its userdb name
  # so existing 调频 records stay.
  user_dict: pinyin_simp
  enable_completion: false              # fewer stray candidates after wubi
  enable_user_dict: true                # 调频 for pinyin too (verify: M1.5 T1.5.6)
  # Adjacent-key correction stays OFF in mixed input: tested with librime
  # 1.17.0 on a Mac (2026-11-09), it turned wubi codes into junk pinyin
  # candidates (trnt → 也嗯, 人, 仍). Typo tolerance in mixed input comes from
  # the derive rules in ergou_pinyin (shagn → shang). After the ` prefix,
  # correction follows Settings (拼音容错).
  enable_correction: false
  # Order is set by lua/ergou/rank.lua in both modes, not by quality.
  initial_quality: 0
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

# ` + pinyin.
pinyin_only:
  tag: pinyin_only
  prefix: "`"
  suffix: "'"
  tips: 〔拼音〕
  dictionary: ergou_pinyin_dict
  prism: ergou_pinyin
  enable_user_dict: false
  enable_correction: true
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

# 中英混输: English words by exact lower-case spelling (ergou_en.dict.yaml,
# prism built by ergou_en.schema.yaml). Placed by lua/ergou/english.lua.
english:
  dictionary: ergou_en
  prism: ergou_en
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  enable_charset_filter: false
  # In front of everything, so english.lua sees it in its window.
  initial_quality: 100
  comment_format:
    - xform/.+//

# Emoji and symbols: 笑 → 😄, 箭头 → → ← ↑ ↓ (see ergou_pinyin_ime.schema.yaml).
emoji:
  option_name: emoji
  opencc_config: ergou_emoji.json
  tips: none
  inherit_comment: false

simplifier:
  option_name: traditionalization
  opencc_config: s2t.json
  tips: none

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    pinyin_only: "^`[a-z']*$"
    calc: "^=[0-9.+*/%^()\\- ]*$"
