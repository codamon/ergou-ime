# ergou-ime — 二狗拼音：只用拼音（普通拼音输入法）
# SPDX-License-Identifier: GPL-3.0-only
#
# The second input mode (D, 2026-11-09): plain pinyin with whole-sentence
# input, initials (zg → 中国), fuzzy pinyin and typo tolerance. Chosen in
# ErgouIME Settings → 输入 → 输入方式; the input method writes
# default.custom.yaml (schema list) and ergou_pinyin_ime.custom.yaml
# (spelling algebra, 双拼 and its preedit_format, correction, 调频) from the
# settings.
#
# Dictionary: ergou_pinyin_dict — 拼音大词库 (rime-ice base + ext, about
# 89 万 entries) once downloaded in Settings, the small pinyin_simp until
# then (ErgouIME/Engine/PinyinDictionary.swift).

schema:
  schema_id: ergou_pinyin_ime
  name: 二狗拼音
  version: "0.1"
  author:
    - ergou-ime contributors
  description: |
    只用拼音。整句输入、简拼、模糊音、容错。
  dependencies:
    # Builds the English prism for table_translator@english (中英混输).
    - ergou_en
    # Builds the prism for table_translator@radical (拆字).
    - ergou_radical

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中, En ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    states: [ 。，, ．， ]
  - name: traditionalization
    states: [ 简, 繁 ]
  # Emoji and symbols after the word that names them (simplifier@emoji).
  # The input method sets it for every text field from Settings
  # (RimeEngine.ensureSession); `reset` is what a bare librime shows.
  - name: emoji
    reset: 1
    states: [ 无, 😄 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    # 以词定字: [ ] take the first / last character of the candidate.
    # Before punctuator, which would type the brackets.
    - lua_processor@*ergou.select_character
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    # "`…" = 拆字: the pinyin of a character's parts (`niuniuniu → 犇).
    - affix_segmentor@radical
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - table_translator@english             # 中英混输
    - table_translator@radical             # 拆字, after the ` prefix
    - lua_translator@*ergou.calc
    - lua_translator@*ergou.date
    - lua_translator@*ergou.phrases
  filters:
    # English word first, or second when a Chinese candidate has the same keys.
    - lua_filter@*ergou.english
    - lua_filter@*ergou.date_after_first
    # 拆字 candidates show how the character is read.
    - reverse_lookup_filter@radical_reverse
    # Before 简 → 繁: the tables are keyed by simplified words.
    - simplifier@emoji
    - simplifier
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  # Default spelling; the input method rewrites it from Settings.
  algebra:
    - derive/^([nl])ue$/$1ve/
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/

translator:
  dictionary: ergou_pinyin_dict
  prism: ergou_pinyin_ime
  # 调频 and, in this mode, new words from committed sentences (D,
  # 2026-11-09). Its own user dictionary (ergou_pinyin_ime.userdb), not
  # pinyin_simp.userdb, which 五笔拼音混输's pinyin translator uses: words
  # built here must not show up there. librime 1.17.0
  # user_dictionary.cc: <ns>/user_dict overrides the name from <ns>/dictionary.
  user_dict: ergou_pinyin_ime
  enable_user_dict: true
  enable_correction: true
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

# 中英混输: English words by exact lower-case spelling (ergou_en.dict.yaml,
# prism built by ergou_en.schema.yaml). Placed by lua/ergou/english.lua.
english:
  dictionary: ergou_en
  prism: ergou_en
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  enable_charset_filter: false
  # In front of everything, so english.lua sees it in its window.
  initial_quality: 100
  comment_format:
    - xform/.+//

# 拆字: for a character you can write but not read. Table and spelling:
# ergou_radical (rime-radical-pinyin). With 双拼 the parts are typed in the
# same 双拼 (the input method picks ergou_radical's spelling rules).
radical:
  tag: radical
  dictionary: ergou_radical
  prefix: "`"
  suffix: "'"
  tips: 〔拆字〕
  enable_user_dict: false
  enable_sentence: false
  enable_charset_filter: false
  comment_format:
    - xform/.+//

# The reading of each 拆字 candidate, from the pinyin dictionary in use.
radical_reverse:
  tags: [ radical ]
  dictionary: ergou_pinyin_dict
  comment_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

# Emoji and symbols: 笑 → 😄, 箭头 → → ← ↑ ↓ (RimeData/opencc/ergou_emoji.json,
# tables built by scripts/gen-emoji-dict.py). Only a candidate that is
# exactly such a word gets them, right after it.
emoji:
  option_name: emoji
  opencc_config: ergou_emoji.json
  tips: none
  inherit_comment: false

# ---- ergou-ime options (written by the input method from Settings) ----
ergou:
  # 以词定字 (lua/ergou/select_character.lua).
  select_character: true
  # 双拼 on (lua/ergou/date.lua, lua/ergou/english.lua).
  shuangpin: false
  # Which 双拼 (Shuangpin rawValue: none, xiaohe, ziranma, microsoft);
  # lua/ergou/english.lua checks English words against its two-key codes.
  shuangpin_scheme: none
  # Fuzzy pinyin pairs that are on (same ids as in ergou_wubi). Only
  # lua/ergou/english.lua reads it here: is the input real pinyin?
  fuzzy: [ zh_z, ch_c, sh_s, n_l, en_eng, in_ing ]

simplifier:
  option_name: traditionalization
  opencc_config: s2t.json
  tips: none

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    radical: "^`[a-z;']*$"
    calc: "^=[0-9.+*/%^()\\- ]*$"
